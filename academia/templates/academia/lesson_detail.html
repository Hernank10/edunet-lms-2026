{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 900px;">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Inicio</a></li>
      <li class="breadcrumb-item">
        <a href="{% url 'academia:course_lessons' leccion.curso.id %}">
          {{ leccion.curso.titulo|truncatechars:40 }}
        </a>
      </li>
      <li class="breadcrumb-item active">Lección {{ leccion.orden }}</li>
    </ol>
  </nav>

  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">{{ leccion.titulo }}</h3>
    </div>
    <div class="card-body">
      <div class="content">
        {{ leccion.contenido|linebreaks }}
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between">
        <a href="{% url 'academia:course_lessons' leccion.curso.id %}"
           class="btn btn-outline-secondary">
          ← Volver al curso
        </a>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-success">
            ✅ Marcar como completada
          </button>
        </form>
      </div>
    </div>
  </div>

</div>
{% endblock %}
