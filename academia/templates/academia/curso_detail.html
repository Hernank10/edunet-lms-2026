{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">{{ curso.nombre }}</h2>

<ul class="list-group">
  {% for item in lecciones %}
    <li class="list-group-item d-flex justify-content-between align-items-center">

      {% if item.bloqueada %}
        🔒 {{ item.obj.titulo }}
      {% else %}
        <a href="#">
          {{ item.obj.titulo }}
        </a>
      {% endif %}

      {% if item.completada %}
        <span class="badge bg-success">✔</span>
      {% endif %}
    </li>
  {% endfor %}
</ul>

<a href="/" class="btn btn-secondary mt-4">← Volver al dashboard</a>
{% endblock %}
