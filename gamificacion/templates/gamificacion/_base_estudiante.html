{% extends "base.html" %}
{% block content %}
<div class="d-flex">

    <h5 class="mb-4">🎓 EduNet</h5>
    <ul class="nav flex-column">
      <li><a class="nav-link text-white" href="{% url 'gamificacion:dashboard' %}">📊 Dashboard</a></li>
      <li><a class="nav-link text-white" href="{% url 'gamificacion:mis_cursos' %}">🎓 Mis Cursos</a></li>

          <button class="btn btn-outline-light btn-sm w-100">🚪 Salir</button>
