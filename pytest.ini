[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

norecursedirs =
    .git
    .tox
    .venv
    venv
    env
    __pycache__
    static
    media
    node_modules
    *.egg
    migrations
    contenido
    docs
    .pytest_cache

addopts = -v --tb=short
